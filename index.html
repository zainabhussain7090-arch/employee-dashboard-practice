<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Employee Management Dashboard</h1>

    <!-- Statistics Cards -->
    <section class="stats">

        <div class="card">
            <h3>Total Employees</h3>
            <p id="totalEmployees">0</p>
        </div>

        <div class="card">
            <h3>IT Department</h3>
            <p id="itEmployees">0</p>
        </div>

        <div class="card">
            <h3>HR Department</h3>
            <p id="hrEmployees">0</p>
        </div>

        <div class="card">
            <h3>Marketing Department</h3>
            <p id="marketingEmployees">0</p>
        </div>

    </section>

    <!-- Form -->
    <section class="form-container">

        <h2>Add Employee</h2>

        <form id="employeeForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name">
                <small class="error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email">
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <select id="department">
                    <option value="">Select Department</option>
                    <option value="IT">IT</option>
                    <option value="HR">HR</option>
                    <option value="Marketing">Marketing</option>
                </select>
                <small class="error" id="departmentError"></small>
            </div>

            <div class="form-group">
                <label for="designation">Designation</label>
                <input type="text" id="designation">
                <small class="error" id="designationError"></small>
            </div>

            <div class="form-group">
                <label for="joiningDate">Joining Date</label>
                <input type="date" id="joiningDate">
                <small class="error" id="joiningDateError"></small>
            </div>

            <button type="submit">Add Employee</button>

        </form>

    </section>

    <!-- Employee Table -->
    <section class="table-container">
<div class="search-container">
    <input
        type="text"
        id="searchInput"
        placeholder="Search by Name or Department"
    >
</div>
        <h2>Employee List</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Joining Date</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="employeeTableBody"></tbody>

        </table>

    </section>

    <script src="script.js"></script>

</body>
</html>
